[project]
name = "permission-mask-checker"
version = "0.1.1"
description = "Checks whether a path's permission bits satisfy a required mask like group-writable or world-readable."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
